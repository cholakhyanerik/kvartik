# Браузерные тесты окна (Правило 2 в CLAUDE.md): `cargo test` под wasm32
# запускает тестовый wasm программой `wasm-bindgen-test-runner`, а она —
# в headless-браузере через его WebDriver (chromedriver). Программа — той же
# версии, что `wasm-bindgen` в Cargo.lock; где её взять — Правило 3.
#
# Только для `cargo run` и `cargo test` под wasm32: `cargo build`, которым
# собирает сайт Trunk, раннер не зовёт.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
# Связи компоновщика в wasm: по ним хук сборки режет окно на части
# (`crates/sw/src/wasm.rs`, задача 58), а без них разрез отвечает «No
# linking section found». Здесь, а не в хуке, — у всех сборок под wasm32
# одни флаги, и cargo не пересобирает зависимости, когда сайт и тесты
# собираются по очереди. Переменная окружения RUSTFLAGS эту строку
# перебивает целиком: с ней сайт не соберётся.
rustflags = ["-Clink-args=--emit-relocs"]
