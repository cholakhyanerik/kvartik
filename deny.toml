# Проверка зависимостей: `cargo deny check` (Правило 13 в CLAUDE.md).
# Известная уязвимость, крейт из чужого реестра или лицензия, несовместимая
# с платной закрытой программой, сборкой не ловятся, а зависимость окна
# исполняется у каждого пользователя.
#
# Формат — cargo-deny 0.20.2 (по исходникам, `src/*/cfg.rs` выпуска 0.20.2,
# 2026-10-10); сама версия закреплена в `.github/workflows/ci.yml`. Чего
# здесь нет, берётся по умолчанию этой версии. Проверяется весь граф: все
# платформы, зависимости сборки и proc-macro — они исполняются на машине
# сборки и в CI.

[advisories]
# Уязвимость — ошибка всегда, отдельной настройки у неё нет. Заброшенный
# автором крейт (`unmaintained`) и небезопасный API (`unsound`) — тоже ошибка,
# и во всём графе, а не только у прямых зависимостей: предупреждение
# в зелёном прогоне никто не читает. Если крейт заменить нельзя, ему пишется
# исключение — с причиной и датой.
unmaintained = "all"
unsound = "all"
# Версию, отозванную автором (yank), чаще всего отзывают из-за ошибки;
# лечится обычно `cargo update -p <крейт>`. Отзыв смотрится только в
# локальном кэше индекса crates.io, без запроса (по исходникам 0.20.2,
# `src/cargo-deny/check.rs`), а в CI этот кэш приходит из rust-cache: свежий
# отзыв может быть не виден, пока кэш не обновится (`cargo update`).
yanked = "deny"
# Исключение, которое больше ничего не прикрывает, — устаревшая запись:
# её удаляют, а не копят.
unused-ignored-advisory = "deny"
ignore = [
    # paste заброшен автором (RustSec, 2024). Приходит через leptos 0.8.22
    # (either_of, reactive_graph, tachys), и заменить его можем не мы, а
    # Leptos. Это proc-macro: исполняется только при сборке, в wasm его кода
    # нет. Других записей о нём в базе нет (2026-10-10). Снять, когда Leptos
    # от него уйдёт.
    { id = "RUSTSEC-2024-0436", reason = "paste через leptos 0.8.22: заменить нельзя, исполняется только при сборке (2026-10-10)" },
]

[licenses]
# Список — решение человека (Правило 9): у лицензии юридический вес.
# Утверждён 2026-10-10: ровно те разрешительные лицензии, что были тогда
# в дереве. Новая лицензия краснит CI, и решение о ней принимается в задаче,
# которая привела зависимость. Условия лицензий исполняет файл лицензий сайта
# (`crates/sw/src/licenses.rs`, с 0.0.78): новая лицензия здесь — ещё
# и строка в его `PREFERENCE`, и тест сверяет оба списка.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    # ed25519-dalek 3 и curve25519-dalek 5 — проверка ключа лицензии
    # (задача 25); разрешена человеком 2026-10-27. Её условие — уведомление
    # и текст лицензии с программой — исполняет файл лицензий сайта (с 0.0.78).
    "BSD-3-Clause",
]

# Свои крейты закрытые (`publish = false`) и лицензии не объявляют.
[licenses.private]
ignore = true

[bans]
# Две версии одного крейта раздувают wasm (Правило 1), но убрать дубль,
# пришедший через Leptos, мы не можем — поэтому предупреждение, а не ошибка.
multiple-versions = "warn"

[sources]
# Только crates.io: крейт из другого реестра или из git — ошибка.
unknown-registry = "deny"
unknown-git = "deny"
