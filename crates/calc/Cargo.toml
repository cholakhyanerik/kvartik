[package]
name = "kvartik-calc"
description = "Калькулятор лендинга Kvartik: пример расчёта налога ядром в браузере"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Калькулятор на страницах kvartik.com (задача 34): свой маленький wasm, а не
# окно Leptos — тому нужна вся программа, 770 КБ wasm, а калькулятору —
# расчёт и его слова из ядра (`tax::example`). Собирает его программа сборки
# (`crates/sw/src/wasm.rs`, `calculator`), как wasm окна, а грузит скрипт
# лендинга после первого текста страницы. Причина каждой зависимости — рядом
# с ней, а размер — время каждого, кто открыл страницу (Правило 1).
[lib]
crate-type = ["cdylib"]

[dependencies]
# Пример расчёта и его слова — ядро: тот же расчёт, что у окна (CLAUDE.md,
# Архитектура). `js` — случайность для идентификаторов записей книги
# примера на wasm32: без неё `uuid` не соберётся (Правило 3).
kvartik-core = { path = "../core", features = ["js"] }
# Вызов из скрипта страницы — той же версии, что у окна: программа
# wasm-bindgen на сайт одна (Правило 3).
wasm-bindgen = "0.2.130"
# «Сегодня» — часы браузера (`js_sys::Date`), один раз на ответ: ядро часов не
# спрашивает (Архитектура, «Время — параметр»). Уже в дереве через окно.
js-sys = "0.3.107"
# Поля формы приходят, а ответ уходит одной строкой JSON: граница JS↔wasm не
# бесплатна (Правило 1). Уже в дереве через ядро.
serde_json = "1.0.154"
