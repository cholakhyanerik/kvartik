[package]
name = "kvartik-keygen"
description = "Выпуск ключей лицензии Kvartik на машине автора"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Программа автора: в сайт не попадает никогда, и окно от неё не зависит.
# Закрытый ключ читается из пути вне рабочей копии (задача 26, «Общее»
# в CLAUDE.md).
[dependencies]
# Подпись ключей лицензии — та же библиотека, которой ядро их проверяет
# (`kvartik_core::license`, задача 25). Фичи по умолчанию — `fast`
# и `zeroize`: таблицы для подписи и стирание закрытого ключа из памяти
# при `drop`; в сайт эта программа не попадает, и размер ей не важен.
ed25519-dalek = "3.0.0"
# Случайность для новой пары — от системы. Уже в дереве через `uuid` ядра,
# MIT или Apache-2.0.
getrandom = "0.4.3"
# Запись ключа — та же, что читает окно (`license::Key`, задача 26): поля,
# подписанные байты и base32 пишет ядро, а не второй код здесь — второй
# однажды разошёлся бы с первым. Без фич: `js` нужна ядру только в браузере.
kvartik-core = { path = "../core" }
