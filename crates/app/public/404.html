<!doctype html>
<!-- Ответ Cloudflare Pages на адрес, которого в сайте нет (задача 15):
     с кодом 404 и без кэша. Без этого файла Pages отдавал бы на любой
     адрес страницу программы с кодом 200 — и под именем пропавшего файла
     с хэшем, с его `immutable` на год. Человека, набравшего не тот адрес,
     переход ведёт в программу: окно знает только адреса `#/…` от корня.
     Слов здесь нет — только имя программы, оно одно на трёх языках.
     Переход — `<meta>`, а не скрипт: CSP встроенных скриптов не пускает.
     Сайт живёт в корне домена; переедет в папку (задача 65) — поменять
     адрес и здесь. В кэш service worker этот файл не идёт:
     crates/sw/src/main.rs. -->
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="refresh" content="0; url=/" />
    <title>Kvartik</title>
  </head>
  <body>
    <a href="/">Kvartik</a>
  </body>
</html>
