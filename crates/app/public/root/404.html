<!doctype html>
<!-- Ответ Cloudflare Pages на адрес, которого в сайте нет (задача 15):
     с кодом 404 и без кэша. Без этого файла Pages отдавал бы на любой
     адрес страницу с кодом 200 — и под именем пропавшего файла с хэшем,
     с его `immutable` на год. Файл лежит в корне сайта, и Pages находит
     его для любого адреса, в /app/ тоже: ищет 404.html вверх по папкам от
     адреса (проверено wrangler pages dev 4.149.0, 2026-10-16). Человека,
     набравшего не тот адрес, переход ведёт в программу — в /app/ (задача
     65): лендинга в корне пока нет, а окно знает только адреса `#/…` от
     своей папки. Слов здесь нет — только имя программы, оно одно на трёх
     языках. Переход — `<meta>`, а не скрипт: CSP встроенных скриптов не
     пускает. В кэш service worker этот файл не идёт:
     crates/sw/src/main.rs. -->
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="refresh" content="0; url=/app/" />
    <title>Kvartik</title>
  </head>
  <body>
    <a href="/app/">Kvartik</a>
  </body>
</html>
