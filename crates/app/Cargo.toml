[package]
name = "kvartik-app"
description = "Окно Kvartik в браузере: Leptos (CSR) в WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Каждую зависимость окна скачивает каждый пользователь на первом заходе
# (Правило 1): размер `dist/` меряется до и после неё, а причина пишется
# рядом.
[dependencies]
# `js` — случайность для идентификаторов записей на wasm32 из WebCrypto
# (`crates/core/Cargo.toml`). Размер `dist/` с ней не изменился: wasm
# 54 560 Б, после brotli 18 709 — как в 0.0.1 (2026-10-10). Пока окно не
# создаёт записей, этого кода в wasm нет.
kvartik-core = { path = "../core", features = ["js"] }
# Реактивность и разметка окна. Только `csr`: сервера у нас нет, страница
# собирается в браузере. API меняется между минорными версиями — сверять по
# исходникам в реестре, а не по примерам из интернета (Правило 3).
leptos = { version = "0.8.22", features = ["csr"] }
# Без него паника в wasm видна в консоли только как `unreachable`,
# и причину не найти (Правило 6). Зовёт его свой хук паники
# (`src/ui/panic.rs`), а потом показывает плашку словами.
console_error_panic_hook = "0.1.7"
# Привязки к браузеру для хранилища (`src/store/`) и платформы
# (`src/platform/`): IndexedDB и `localStorage`, просьба о постоянном
# хранении, шифр WebCrypto и файлы копии (задача 7), service worker
# и установка (задача 8), консоль для причин ошибок, плашка сбоя прямо
# в DOM (`src/ui/panic.rs`, задача 48). Все три крейта уже
# были в дереве через Leptos — новых авторов
# нет; версии — те же, что в замке. Фичи `web-sys` — ровно нужные
# интерфейсы: каждая лишняя — привязки, которые никто не зовёт. Будущее
# Rust из `Promise` и `spawn_local` даёт сам `js-sys` (с 0.3.106 там живёт
# то, что было `wasm-bindgen-futures`).
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "AesGcmParams",
    "Blob",
    "BlobPropertyBag",
    "CacheStorage",
    "console",
    "Crypto",
    "CryptoKey",
    "Document",
    "DomException",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Node",
    "Pbkdf2Params",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "ServiceWorkerState",
    "Storage",
    "StorageManager",
    "SubtleCrypto",
    "Url",
    "VisibilityState",
    "Window",
] }

# Браузерные тесты хранилища (`src/store/tests.rs`) и плашки сбоя
# (`src/ui/panic.rs`): только под wasm32,
# в сайт не попадают — Trunk зовёт `cargo build`, а он dev-зависимостей не
# собирает. Версия `wasm-bindgen-test` идёт в паре с `wasm-bindgen`
# (0.3.79 ↔ 0.2.129: в его Cargo.toml — точные `=`), и программа
# `wasm-bindgen-test-runner` нужна той же версии (Правило 3). `serde` —
# записи для проб. `Response` у `web-sys` — тест читает файл копии по его
# адресу `blob:`, `NodeList` — тест плашки считает её копии,
# `DataTransfer` — тест окна кладёт файл копии в поле выбора файла; фичи
# dev-зависимостей в сборку сайта не попадают
# (резолвер 3).
# Машинные тесты окна (`tests/*.rs`): манифест программы — JSON, и тест
# читает его разбором, а не поиском строк (`tests/pwa.rs`, `tests/tokens.rs`).
# Крейт уже в дереве через ядро — новых авторов нет.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
serde = { version = "1.0.229", features = ["derive"] }
web-sys = { version = "0.3.106", features = [
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "NodeList",
    "Response",
] }
