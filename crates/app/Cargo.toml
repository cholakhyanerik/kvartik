[package]
name = "kvartik-app"
description = "Окно Kvartik в браузере: Leptos (CSR) в WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Каждую зависимость окна скачивает каждый пользователь на первом заходе
# (Правило 1): размер `dist/` меряется до и после неё, а причина пишется
# рядом.
[dependencies]
# `js` — случайность для идентификаторов записей на wasm32 из WebCrypto
# (`crates/core/Cargo.toml`). Размер `dist/` с ней не изменился: wasm
# 54 560 Б, после brotli 18 709 — как в 0.0.1 (2026-10-10). Пока окно не
# создаёт записей, этого кода в wasm нет.
kvartik-core = { path = "../core", features = ["js"] }
# Реактивность и разметка окна. Только `csr`: сервера у нас нет, страница
# собирается в браузере. API меняется между минорными версиями — сверять по
# исходникам в реестре, а не по примерам из интернета (Правило 3).
leptos = { version = "0.8.23", features = ["csr"] }
# Без него паника в wasm видна в консоли только как `unreachable`,
# и причину не найти (Правило 6). Зовёт его свой хук паники
# (`src/ui/panic.rs`), а потом показывает плашку словами.
console_error_panic_hook = "0.1.7"
# Привязки к браузеру для хранилища (`src/store/`) и платформы
# (`src/platform/`): IndexedDB и `localStorage`, просьба о постоянном
# хранении, шифр WebCrypto и файлы копии (задача 7), service worker
# и установка (задача 8), заметки новой версии из её кэша
# (`CacheQueryOptions`; задача 67), консоль для причин ошибок, плашка сбоя прямо
# в DOM (`src/ui/panic.rs`, задача 48), шрифты документа у своего сайта
# (`fetch`, `Response`; задача 12), файл с именем для «Поделиться»
# (`FilePropertyBag`; задача 13 — сам Web Share в `web-sys` нестабилен,
# привязки к нему свои, `src/platform/share.rs`), папка автокопии
# (`FileSystem…`, `WritableStream`; задача 29 — выбор папки и разрешения
# в `web-sys` нестабильны, привязки к ним свои,
# `src/platform/autobackup.rs`), где мышь — у кнопок, карточек и кружка
# у курсора (`PointerEvent`, `MouseEvent`, `DomRect`; задача 86 — переход
# View Transitions в `web-sys` нестабилен, привязка к нему своя,
# `src/platform/motion.rs`). Все три крейта уже
# были в дереве через Leptos — новых авторов
# нет; версии — те же, что в замке. Фичи `web-sys` — ровно нужные
# интерфейсы: каждая лишняя — привязки, которые никто не зовёт. Будущее
# Rust из `Promise` и `spawn_local` даёт сам `js-sys` (с 0.3.106 там живёт
# то, что было `wasm-bindgen-futures`).
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = [
    "AesGcmParams",
    "Blob",
    "BlobPropertyBag",
    # Копия своих цветов для первого кадра (задача 89, `platform::look`):
    # окно кладёт стиль палитры в свой кэш, а отдаёт его service worker.
    "Cache",
    "CacheQueryOptions",
    "CacheStorage",
    "console",
    "Crypto",
    "CryptoKey",
    "CssStyleDeclaration",
    "Document",
    "DomException",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FilePropertyBag",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "ImageBitmap",
    "ImageEncodeOptions",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageChannel",
    "MessagePort",
    "MouseEvent",
    "Navigator",
    "Node",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Pbkdf2Params",
    "PointerEvent",
    "Response",
    "ResponseInit",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "ServiceWorkerState",
    "Storage",
    "StorageManager",
    "SubtleCrypto",
    "Url",
    "VisibilityState",
    "Window",
    "WritableStream",
] }

# Браузерные тесты хранилища (`src/store/tests.rs`) и плашки сбоя
# (`src/ui/panic.rs`): только под wasm32,
# в сайт не попадают — Trunk зовёт `cargo build`, а он dev-зависимостей не
# собирает. Версия `wasm-bindgen-test` идёт в паре с `wasm-bindgen`
# (0.3.80 ↔ 0.2.130: в его Cargo.toml — точные `=`), и программа
# `wasm-bindgen-test-runner` нужна той же версии (Правило 3). `serde` —
# записи для проб. `NodeList` — тест плашки считает её копии,
# `DataTransfer` — тест окна кладёт файл копии в поле выбора файла,
# `HtmlSelectElement` — тест клиентов выбирает страну и валюту, `History` —
# тест экранов нажимает «Назад», `KeyboardEventInit` — тест окна «Что нового»
# нажимает Escape; фичи
# dev-зависимостей в сборку сайта не попадают (резолвер 3).
# Машинные тесты окна (`tests/*.rs`): манифест программы — JSON, и тест
# читает его разбором, а не поиском строк (`tests/pwa.rs`, `tests/tokens.rs`).
# Крейт уже в дереве через ядро — новых авторов нет.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
serde = { version = "1.0.229", features = ["derive"] }
# Браузерные тесты лицензии подписывают ключи парой проб (`ui/license.rs`):
# закрытого ключа автора у них нет и быть не может (Правило 9). Крейт уже
# в дереве через ядро, с теми же фичами.
ed25519-dalek = { version = "3.0.0", default-features = false }
web-sys = { version = "0.3.107", features = [
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "FileSystemRemoveOptions",
    "History",
    "HtmlSelectElement",
    "KeyboardEventInit",
    "NodeList",
    "PointerEventInit",
] }
