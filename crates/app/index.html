<!doctype html>
<!-- Страница, по которой Trunk собирает сайт. `lang` и `title` — до выбора
     языка окна и имени программы (задачи 4 и 16): потом их ставит окно. -->
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kvartik</title>
    <!-- wasm окна. `s` — wasm-opt на размер, только в `trunk build --release`
         (Правило 1; замер — в CLAUDE.md). -->
    <link data-trunk rel="rust" data-wasm-opt="s" />
  </head>
  <body></body>
</html>
