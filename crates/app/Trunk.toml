# Сборка окна: `trunk serve` для глазного прогона, `trunk build --release`
# для выкладки. Обе команды запускаются из crates/app.

# Версия Trunk, которой собирается сайт, — одна на машине разработчика и в CI
# (Правило 3; почему RC, а не 0.21 — в CLAUDE.md). Старый Trunk откажется
# собирать с понятной ошибкой, а не соберёт молча иначе. Требование semver:
# годятся и 0.22.0-rc.N новее, и 0.22.x.
trunk-version = "0.22.0-rc.2"

[build]
target = "index.html"
dist = "dist"
# Сжатие HTML, CSS и клея JS — только в выпускной сборке: в отладке его
# читают глазами.
minify = "on_release"

# Wasm окна и service worker — программой сборки `kvartik-sw` (`crates/sw/`),
# когда остальные файлы сайта уже собраны. Wasm она собирает сама, а не
# Trunk: окно режется на части, которые грузятся по нажатию (задача 58),
# а Trunk резать не умеет (шапка `crates/sw/src/wasm.rs`). Потом она пишет
# `sw.js` по шаблону `public/sw.js` — со списком файлов для кэша и хэшем
# сборки, иначе браузер не узнал бы о новой версии (шапка шаблона).
# `cargo`, а не скрипт оболочки: одна команда и на Windows, и в CI. Папку
# сборки программа берёт из `TRUNK_STAGING_DIR`, а запускается из папки
# этого файла (по исходникам trunk 0.22.0-rc.2, `src/hooks.rs`).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "--package", "kvartik-sw", "--", "--wasm", "kvartik-app", "public/sw.js"]
