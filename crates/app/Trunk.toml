# Сборка окна: `trunk serve` для глазного прогона, `trunk build --release`
# для выкладки. Обе команды запускаются из crates/app.

# Версия Trunk, которой собирается сайт, — одна на машине разработчика и в CI
# (Правило 3; почему 0.22, а не 0.21 — в CLAUDE.md). Старый Trunk откажется
# собирать с понятной ошибкой, а не соберёт молча иначе. Требование semver:
# годятся и 0.22.x новее.
trunk-version = "0.22.1"

[build]
target = "index.html"
# Весь сайт: программа — в dist/app/, файлы корня — в dist/ (задача 65).
dist = "dist"
# Программа живёт в папке сайта, а корень отдан лендингу (задача 65): тогда
# данные калькулятора лендинга программе видны — происхождение одно,
# а лендинг — готовые страницы HTML, текст которых виден и без wasm
# (задача 34, crates/sw/src/landing.rs). Trunk пишет этот адрес в ссылки
# страницы, а раскладывает файлы по папкам хук ниже. Адрес — навсегда:
# установленная программа помнит свои `id`, `start_url` и `scope`, а они
# считаются от адреса манифеста.
public_url = "/app/"
# Сжатие HTML, CSS и клея JS — только в выпускной сборке: в отладке его
# читают глазами.
minify = "on_release"

# `trunk serve` отдаёт весь сайт от корня, как хостинг: программа —
# на http://127.0.0.1:8080/app/. По умолчанию он отдавал бы папку сборки
# с адреса `public_url`, и программа оказалась бы в /app/app/ (по исходникам
# trunk 0.22.0-rc.2, `src/serve/mod.rs`).
[serve]
serve_base = "/"

# Раскладка сайта, wasm окна и service worker — программой сборки
# `kvartik-sw` (`crates/sw/`), когда остальные файлы уже собраны. Собранное
# Trunk она перекладывает в папку программы (`public_url`), а в корень
# кладёт файлы корня сайта из `public/root/` (задача 65) и лендинг: страницы
# трёх языков из таблицы строк ядра, стили и скрипт из `site/` на
# оформлении окна из `style/` (задача 34). Wasm она собирает
# сама, а не Trunk: окно режется на части, которые грузятся по нажатию
# (задача 58), а Trunk резать не умеет (шапка `crates/sw/src/wasm.rs`).
# Потом она пишет `sw.js` программы по шаблону `public/sw.js` — со списком
# файлов для кэша и хэшем сборки, иначе браузер не узнал бы о новой версии
# (шапка шаблона). `cargo`, а не скрипт оболочки: одна команда и на
# Windows, и в CI. Папку сборки и адрес программы она берёт из
# `TRUNK_STAGING_DIR` и `TRUNK_PUBLIC_URL`, а запускается из папки этого
# файла (по исходникам trunk 0.22.0-rc.2, `src/hooks.rs`).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "--package", "kvartik-sw", "--", "--root", "public/root", "--site", "site", "--style", "style", "--wasm", "kvartik-app", "public/sw.js"]
