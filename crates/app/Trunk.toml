# Сборка окна: `trunk serve` для глазного прогона, `trunk build --release`
# для выкладки. Обе команды запускаются из crates/app.

# Версия Trunk, которой собирается сайт, — одна на машине разработчика и в CI
# (Правило 3; почему RC, а не 0.21 — в CLAUDE.md). Старый Trunk откажется
# собирать с понятной ошибкой, а не соберёт молча иначе. Требование semver:
# годятся и 0.22.0-rc.N новее, и 0.22.x.
trunk-version = "0.22.0-rc.2"

[build]
target = "index.html"
dist = "dist"
# Сжатие HTML, CSS и клея JS — только в выпускной сборке: в отладке его
# читают глазами.
minify = "on_release"

# Service worker (задача 8): `sw.js` пишет программа сборки `kvartik-sw`
# (`crates/sw/`) по шаблону `public/sw.js`, когда все файлы сайта уже
# собраны, — со списком файлов для кэша и хэшем сборки. Иначе браузер не
# узнал бы о новой версии (шапка шаблона). `cargo`, а не скрипт оболочки:
# одна команда и на Windows, и в CI. Папку сборки программа берёт из
# `TRUNK_STAGING_DIR`, а запускается из папки этого файла (по исходникам
# trunk 0.22.0-rc.2, `src/hooks.rs`).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "--package", "kvartik-sw", "--", "public/sw.js"]
