[package]
name = "kvartik-core"
description = "Ядро Kvartik: всё, что проверяется без браузера"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# По умолчанию — ни одной браузерной зависимости, и не появится: ядро
# собирается и проходит тесты обычным `cargo test` на любой машине
# («Архитектура» в CLAUDE.md). Браузер нужен только источнику случайности
# на wasm32, и его включает фича `js` ниже. Причина каждой зависимости
# пишется здесь же, рядом с ней.
[dependencies]
# Постоянный идентификатор записи — случайный UUID версии 4
# (`model/record.rs`). Без фич по умолчанию: `std` в uuid 1.29.0 даёт только
# переводы в `String` и `Vec<u8>` и часы — `Timestamp::now()` и `SystemTime`
# (по исходникам: `src/fmt.rs`, `src/lib.rs`, `src/timestamp.rs`;
# 2026-10-23). Переводы ядру не нужны, а часов у ядра быть не должно
# (Архитектура, «Время — параметр»). На машине случайность — от системы,
# через getrandom 0.4. `serde` — идентификатор в данных и в файле копии
# строкой `xxxxxxxx-xxxx-…`: так он и записывается, и читается (по
# исходникам uuid 1.29.0, `src/external/serde_support.rs`; 2026-10-23).
uuid = { version = "1.29.0", default-features = false, features = ["v4", "serde"] }
# Версионный формат данных и файла копии (`format/`): руками он не пишется
# («Общее» в CLAUDE.md). Оба крейта уже были в дереве через Leptos, так что
# новых авторов и лицензий не прибавилось. `derive` выводит запись и чтение
# там, где у типа нет запретных значений; где есть — чтение пишется руками
# через конструктор типа (Правило 13).
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` — запись внутри конверта и файла копии читается сначала
# нетронутым куском JSON, а разбирается потом — своим видом и по версии
# формата (`format/`). Без него каждую запись пришлось бы строить деревом
# `serde_json::Value`. Своих зависимостей у фичи нет (по исходникам
# serde_json 1.0.154, Cargo.toml; 2026-10-12).
serde_json = { version = "1.0.154", features = ["raw_value"] }
# Сжатие deflate для PDF (`doc/`, задача 12): шрифты, страницы и логотип
# ложатся в файл сжатыми (FlateDecode), а логотип PNG разжимается, чтобы
# отделить прозрачность в свою маску. Им же с 0.0.27 сжимается файл копии
# перед шифром (`format/backup.rs`, задача 14): разжатие — с пределом. Свой писатель PDF на нём, а не
# `krilla` или `printpdf`: krilla прибавляла к wasm 462 КБ после brotli,
# `subsetter` — 47, `pdf-writer` — 32, а `miniz_oxide` — около 10 (замер
# 2026-10-14, разведка задачи 12). Владельцы — oyvindln и Frommi, MIT, Zlib
# или Apache-2.0, `build.rs` нет; единственная зависимость — `adler2`.
# По умолчанию — `with-alloc`: без неё нет сжатия.
miniz_oxide = "0.9.1"

[features]
# Источник случайности на wasm32 — WebCrypto (`crypto.getRandomValues`):
# без него `uuid` с `v4` под wasm32 не собирается (`compile_error!`
# в `src/rng.rs`, по исходникам uuid 1.29.0). По умолчанию выключена: ядро —
# библиотека и браузерный источник само не выбирает (README getrandom
# 0.4.3). Включает её тот, кто собирает ядро под wasm32: окно, а потом
# воркер PDF или калькулятор лендинга (Правило 3).
js = ["uuid/js"]
