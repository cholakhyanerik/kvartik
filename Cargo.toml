[workspace]
# Слои и направление зависимостей — «Архитектура» в CLAUDE.md. Ядро
# проверяется обычным `cargo test` без браузера, окно собирается в wasm32,
# калькулятор лендинга — в свой маленький wasm (задача 34), ИИ-помощник — в
# свой wasm на своём происхождении `ai.kvartik.com` (задача 111), программа
# ключей в сайт не попадает никогда, а программа сборки кладёт в него только
# написанное и разложенное ею.
members = ["crates/core", "crates/app", "crates/keygen", "crates/sw", "crates/calc", "crates/ai"]
# У виртуального манифеста нет своего `edition`, и без явного резолвера cargo
# берёт первый. Третий подбирает зависимости под `rust-version` (Правило 3).
resolver = "3"

[workspace.package]
# Единственный источник версии программы (Правило 5): окно берёт её через
# `env!("CARGO_PKG_VERSION")` и пишет в каждую резервную копию.
version = "0.0.184"
edition = "2024"
# Ровно тот Rust, что стоит в системе: major.minor `rustc --version`
# (Правило 3 в CLAUDE.md). Проект проверяется тем компилятором, которым
# собирается, и обещать сборку на старом, которую никто не проверял, нельзя.
# Обновился Rust — число поднимается здесь и в README, а код адаптируется
# под новые предупреждения `clippy`. Самой требовательной зависимости,
# `leptos` 0.8.22, нужно 1.88.
rust-version = "1.100"
repository = "https://github.com/cholakhyanerik/kvartik"
# Платная программа: в crates.io не публикуется ни один крейт.
publish = false

# Выпускная сборка — это прежде всего wasm окна, и собирается она на размер:
# wasm скачивает и компилирует каждый пользователь на первом заходе
# (Правило 1). Настройки подобраны замером `dist/` — записи
# в docs/measurements.md. `lto` и `codegen-units = 1` срезают около 15 % wasm. `z`, а не
# `s`: на пустом экране они не расходились, а с формами профиля и клиента
# `z` меньше на 5,4 % после brotli, и рабочий экран на телефоне появляется
# на 0,13 с раньше (замер 2026-10-13, задача 57). Профиль общий
# с `kvartik-keygen`: программе ключей это не мешает, а `lto`
# и `codegen-units` по пакетам не переопределяются.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Программу сборки сайта (`kvartik-sw`) хук Trunk зовёт `cargo run`, то есть
# отладочной сборкой, а brotli уровня 11 без оптимизаций сжимал бы мегабайты
# wasm (задача 109) минутами. Оптимизирован только он: остальное в ней ждёт
# диска и программ, а не процессора.
[profile.dev.package.brotli]
opt-level = 3
