# Проверка на каждый push и pull request, а после неё — выкладка: push
# в main — сайт всем, pull request — предпросмотр (задачи 15 и 50).
#
# Одна ОС, Linux: wasm одинаков на всех системах, а ядро не трогает ничего
# системного. Матрица ОС понадобится только с настольной версией (задача 40).
# Репозиторий приватный, и минуты здесь считаются (Правило 11 в CLAUDE.md).
#
# Действия — по SHA коммита, а не по тегу: тег можно переписать (Правило 13).
# Выкладка видит токен Cloudflare, а проверка собирает то, что выкладка
# отдаст людям, — подменённое действие в любом из заданий дошло бы до всех.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый push в ту же ветку отменяет предыдущий прогон: держать очередь
# из устаревших сборок незачем. Прерванная выкладка ничего не меняет:
# Cloudflare переключает сайт на новую сборку, только когда она залита вся.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ключу GitHub в прогонах — только чтение: писать в репозиторий незачем.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Проект Cloudflare Pages с прямой загрузкой (задача 50) и его свой
  # домен (задача 16): `kvartik.pages.dev` переадресует на него.
  PAGES_PROJECT: kvartik
  SITE_URL: https://kvartik.com
  # Та же версия, что в `trunk-version` у crates/app/Trunk.toml: старше Trunk
  # откажется собирать. Меняется версия — меняются оба места и сумма ниже.
  TRUNK_VERSION: v0.22.1
  # Сумма архива `trunk-x86_64-unknown-linux-gnu.tar.gz` этого выпуска
  # (файл `.sha256` рядом с архивом на GitHub и поле `digest` в API GitHub,
  # сверено 2026-10-27). Записана здесь, а не скачивается вместе с архивом:
  # подменённый выпуск принёс бы и подменённую сумму.
  TRUNK_SHA256: 2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1
  # Проверка зависимостей по `deny.toml` (Правило 13). 0.20.2 — последняя на
  # GitHub 2026-10-10. Формат `deny.toml` между версиями меняется: сменилась
  # версия — сверить его по исходникам нового выпуска. Сумма архива
  # `cargo-deny-<версия>-x86_64-unknown-linux-musl.tar.gz` взята из файла
  # `.sha256` рядом с ним и совпала со сводкой выпуска на GitHub (2026-10-10);
  # записана здесь по той же причине, что у Trunk. Те же версия и сумма —
  # в advisories.yml (проверка по расписанию, задача 52): меняются вместе.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  # wasm-bindgen для сборки сайта и раннер браузерных тестов — из выпуска
  # wasm-bindgen ровно той версии, что в Cargo.lock (Правило 3): соседняя
  # версия может пройти молча и проверить не тот wasm. Шаг ниже сверяет её
  # с замком. Сумма архива
  # `wasm-bindgen-<версия>-x86_64-unknown-linux-musl.tar.gz` — из файла
  # `.tar.gz.sha256sum` рядом с ним; совпала с полем `digest` в API GitHub
  # (2026-11-01).
  WASM_BINDGEN_VERSION: 0.2.130
  WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
  # wasm-opt для сборки сайта (`crates/sw/src/wasm.rs`, задача 58): та же
  # версия binaryen, что `WASM_OPT_VERSION` там, — меняются обе. Сумма
  # архива `binaryen-<версия>-x86_64-linux.tar.gz` — из файла `.sha256`
  # рядом с ним; совпала с полем `digest` в API GitHub (2026-11-05).
  BINARYEN_VERSION: version_133
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489

jobs:
  check:
    name: Linux
    runs-on: ubuntu-latest
    # Втрое дольше обычного прогона (13 минут, 2026-11-15). Без предела
    # GitHub ждёт зависшее задание шесть часов, а минуты CI у приватного
    # репозитория считаются: «Собранный сайт в браузере» однажды простоял
    # 22 минуты, пока прогон не отменили (2026-11-15).
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Коммит ветки `stable` от 2026-10-09; Rust — последний стабильный,
      # как и раньше.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Готовая сборка с GitHub, а не `cargo install`: та собирается
      # из исходников минут восемь на каждом прогоне.
      #
      # Выпуски GitHub отдаёт с перебоями: 2026-11-08 загрузки полчаса
      # отвечали 504, и прогоны падали, не начав сборки. Поэтому загрузка
      # повторяется до шести раз с паузой 1, 2, 4 … 32 с — около минуты:
      # короткий сбой прогон переживает, а долгий стоит минуту-две Actions
      # (минуты считаются, Правило 11) вместо нового прогона. Любая ошибка,
      # а не только 5xx (`--retry-all-errors`): обрыв соединения посреди
      # архива — тоже сбой сети. Кэш программ не нужен: загрузка занимает
      # секунды, а кэш — ещё одно чужое действие, и лежит он у того же
      # GitHub. Так же — у загрузок ниже и в advisories.yml.
      - name: Trunk
        run: |
          curl -sSfL --retry 6 --retry-all-errors -o trunk.tar.gz \
            "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar -xzf trunk.tar.gz -C "$HOME/.cargo/bin" trunk
          rm trunk.tar.gz
          trunk --version

      # Тем же путём, что Trunk: готовая сборка, сумма — из `env` выше.
      - name: cargo-deny
        run: |
          curl -sSfL --retry 6 --retry-all-errors -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz -C "$HOME/.cargo/bin" --strip-components=1 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          rm cargo-deny.tar.gz
          cargo deny --version

      # Тем же путём: готовая сборка, сумма — из `env` выше. Из архива нужны
      # `wasm-bindgen` — им хук сборки сайта обрабатывает wasm окна — и
      # `wasm-bindgen-test-runner`; версия — только та, что в замке.
      - name: wasm-bindgen и wasm-bindgen-test-runner
        run: |
          grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep -qx "version = \"${WASM_BINDGEN_VERSION}\"" \
            || { echo "wasm-bindgen в Cargo.lock — не ${WASM_BINDGEN_VERSION}: поднять версию и сумму в ci.yml"; exit 1; }
          curl -sSfL --retry 6 --retry-all-errors -o wasm-bindgen.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf wasm-bindgen.tar.gz -C "$HOME/.cargo/bin" --strip-components=1 \
            "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" \
            "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen-test-runner"
          rm wasm-bindgen.tar.gz
          wasm-bindgen --version
          wasm-bindgen-test-runner --version

      # Тем же путём: готовая сборка, сумма — из `env` выше. Из архива нужен
      # один `wasm-opt`.
      - name: wasm-opt
        run: |
          curl -sSfL --retry 6 --retry-all-errors -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum -c -
          tar -xzf binaryen.tar.gz -C "$HOME/.cargo/bin" --strip-components=2 \
            "binaryen-${BINARYEN_VERSION}/bin/wasm-opt"
          rm binaryen.tar.gz
          wasm-opt --version

      # Ровно те команды, что перечислены в Правиле 2 CLAUDE.md, и в том же
      # порядке. Клиппи дважды: на машине окно собирается как обычная
      # программа, и ветки `#[cfg(target_arch = "wasm32")]` — среди них
      # браузерные тесты — видит только второй прогон.
      #
      # Все — по замку, `--locked` (задача 85): `Cargo.lock`, отставший от
      # `Cargo.toml` в коммите, останавливает прогон словами cargo («cannot
      # update the lock file … because --locked was passed»). Без флага cargo
      # молча выбрал бы новые версии с crates.io, которых человек в замке не
      # видел, и сайт с ними ушёл бы всем (Правило 13). На машине флага нет:
      # там замок догоняет `Cargo.toml` сборкой перед коммитом (skill
      # `finish-task`).
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p kvartik-app --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Браузерные тесты — в headless Chrome образа. Драйвер — явно: иначе
      # раннер первым найдёт в PATH geckodriver, и тесты уйдут в Firefox.
      # При нуле тестов раннер выходит с кодом 0 («no tests to run!») —
      # тесты, выключенные `cfg` по ошибке, дали бы зелёный прогон, поэтому
      # число прошедших проверяется. `shell: bash` — ради `pipefail`: без
      # него `tee` проглотил бы код ошибки `cargo`.
      - name: cargo test -p kvartik-app --target wasm32-unknown-unknown --bin kvartik-app
        shell: bash
        run: |
          CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" \
            cargo test -p kvartik-app --target wasm32-unknown-unknown --bin kvartik-app --locked 2>&1 | tee browser-tests.log
          grep -E "test result: ok\. [1-9][0-9]* passed" browser-tests.log
      # Те же тесты — в headless Firefox образа (задача 54): хранилище
      # держится на поведении движка — жива ли транзакция после `await`, где
      # приходит `QuotaExceededError`, — и поломка в одном движке прошла бы
      # зелёной в другом. Окно Firefox «Разрешить хранить данные?» на
      # `persist()` не дало бы ответа никогда: его снимают настройки профиля
      # из `crates/app/webdriver.json` (раннер читает файл из каталога
      # пакета; по исходникам wasm-bindgen-cli 0.2.130, `headless.rs`).
      # Драйвер — явно, а что тесты шли в Firefox, проверяет строка раннера.
      - name: cargo test -p kvartik-app --target wasm32-unknown-unknown --bin kvartik-app (Firefox)
        shell: bash
        run: |
          GECKODRIVER="$GECKOWEBDRIVER/geckodriver" \
            cargo test -p kvartik-app --target wasm32-unknown-unknown --bin kvartik-app --locked 2>&1 | tee browser-tests-firefox.log
          grep -q "Running headless tests in Firefox" browser-tests-firefox.log
          grep -E "test result: ok\. [1-9][0-9]* passed" browser-tests-firefox.log
      - run: trunk build --release
        working-directory: crates/app
      # Сборка сайта зовёт cargo и без `--locked`, и флаг туда не передать
      # (по исходникам trunk 0.22.1, сверено 2026-11-05): сам Trunk —
      # `cargo metadata` манифеста окна (`src/config/manifest.rs:21`) ещё до
      # того, как прочтёт `data-trunk-skip` (`src/pipelines/rust/mod.rs:197`
      # и `:261`), а его собственный `--locked` идёт только в его
      # `cargo build` (`:428`), который мы пропускаем; хук — строкой
      # `cargo run` в `Trunk.toml`. Отставший замок `cargo metadata`
      # переписывает молча и с кодом 0 (проверено 2026-11-05), и `--locked`
      # в командах самого хука увидел бы уже переписанный. Поэтому — сверка
      # с коммитом: замок, который тронула сборка, краснит прогон до
      # выкладки. С командами по замку выше сюда не дойти; она держит,
      # если сборку сайта переставят раньше них.
      - name: Сборка не тронула Cargo.lock
        run: git diff --exit-code -- Cargo.lock
      # Собранный сайт — в браузере (задача 60): части wasm рисуют экраны
      # и формы, копия и PDF работают, без сети всё приходит из кэша service
      # worker, а несгруженная часть — словами с «Отменой». И новая версия
      # (задача 67): она ждёт открытой формы, включается сама и показывает
      # окно «Что нового» — сломанное, это заперло бы программу всем, кто
      # получит следующую версию. Браузерные тесты
      # выше идут на тестовом wasm, который никто не режет, и этого не видят:
      # разрез держится за внутренности wasm-bindgen, и после обновления
      # сборка прошла бы зелёной с неоткрывающимися экранами. Chrome и Node —
      # из образа, скрипт — без зависимостей (шапка `tools/browser/check.mjs`).
      - name: Собранный сайт в браузере
        run: |
          google-chrome --version
          node --version
          node tools/browser/check.mjs
      # Новая запись в базе RustSec краснит прогон и без нашего изменения —
      # так и задумано: что с ней делать, решает человек (`deny.toml`).
      # По замку, как сборка: дерево cargo-deny берёт у `cargo metadata`,
      # и без `--locked` проверил бы версии, которых в коммите нет.
      - run: cargo deny --locked check
      # Собранный и проверенный сайт — заданию выкладки: выкладывается ровно
      # он, а не пересборка (задача 50). Последним шагом — когда все
      # проверки прошли. День хранения: больше он никому не нужен.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: crates/app/dist
          if-no-files-found: error
          retention-days: 1

  # Выкладка на Cloudflare Pages — только после зелёной проверки и только
  # тем, что она собрала (задача 50). Push в main — сайт всем; pull request
  # — предпросмотр на адресе `<ветка>.kvartik.pages.dev` с данными своими
  # (CLAUDE.md, «Происхождение сайта»). У pull request из чужой копии
  # репозитория секретов нет, и он не выкладывается.
  deploy:
    name: Выкладка
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Обычно — минута; проверка выкладки повторяет устаревший ответ до трёх
    # минут на адрес (`tools/deploy/check.sh`), и 20 минут — с запасом.
    timeout-minutes: 20
    # Сайт всем выкладывают двое: это задание и выкладка курсов ЦБ по
    # расписанию (`rates.yml`, задача 43), и разом — никогда: та выкладывает
    # прежнюю сборку с новыми курсами и, идя рядом, вернула бы сайт к прежней
    # сборке. Ждущее задание группы GitHub снимает, когда встаёт следующее
    # ждущее, — новое задание выкладки ждёт только выкладку курсов, а та идёт
    # по одной (своя группа в `rates.yml`), и снять выкладку CI ей нечем.
    # Предпросмотры pull request — своей группой на ветку.
    concurrency:
      group: ${{ github.event_name == 'push' && 'pages-production' || format('pages-preview-{0}', github.ref) }}
      cancel-in-progress: false

    steps:
      # Из репозитория нужны только wrangler с замком и скрипты выкладки.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/deploy
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # wrangler и всё его дерево — из замка `tools/deploy/package-lock.json`,
      # каждый пакет со своей суммой. Скрипты установки не запускаются:
      # `pages deploy` работает и без них (разведка задачи 15, 2026-10-15).
      # Node — из образа: wrangler нужен 22 или новее, а в ubuntu-24.04 —
      # 22, в 26.04 — 24.
      - run: npm ci --ignore-scripts
        working-directory: tools/deploy

      # Курсы ЦБ (задача 43) — файлом `app/rates.json` рядом с программой,
      # но не в ней: ни в кэше service worker, ни в хэше сборки, — поэтому
      # он кладётся сюда, к выкладке, а не сборкой. Не ответил ЦБ — прежний
      # файл с сайта, нет и его — выкладка без файла: программа тогда просто
      # не подсказывает курс (шапка `tools/deploy/rates.mjs`). Выкладку шаг не
      # держит ни сбоем, ни временем: ЦБ — чужой сервис.
      - name: Курсы ЦБ
        timeout-minutes: 3
        continue-on-error: true
        run: node tools/deploy/rates.mjs dist --fallback "$SITE_URL" --optional

      # Сначала — предпросмотр той же сборки и проверка на нём: заголовки
      # решает хостинг, и увидеть их можно только на выкладке (CSP, кэш, тип
      # и сжатие каждого файла, страница и `sw.js` этой сборки — шапка
      # `tools/deploy/check.sh`). Сайт всем — только после неё: иначе CSP
      # без `'wasm-unsafe-eval'` дошёл бы до людей пустой страницей раньше,
      # чем покраснел CI. У push в main предпросмотр — ветка `ci-check`;
      # у pull request — его ветка, и `main` ей быть нельзя: такая выкладка
      # стала бы сайтом всем мимо push в main. Вторая заливка почти
      # бесплатна: файлы, которые уже есть, Pages не принимает заново.
      - name: Выкладка предпросмотра
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'ci-check' }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ "$BRANCH" != main ] || { echo "ветка pull request — main: его выкладка стала бы сайтом всем"; exit 1; }
          url="$(bash tools/deploy/deploy.sh "$BRANCH" dist "$COMMIT")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Предпросмотр: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Проверка предпросмотра
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: bash tools/deploy/check.sh "$URL" dist

      # Сайт, который сейчас уйдёт всем, — выкладке курсов по расписанию
      # (`rates.yml`): она выкладывает ровно его с новыми курсами, без
      # пересборки. До выкладки, а не после: отменённая или упавшая после
      # выкладки работа не оставит артефакт старше сайта, а артефакт новее
      # сайта (выкладка не удалась) выкладка курсов отвергнет сверкой с ним
      # (`tools/deploy/same.mjs`). Артефакт, а не кэш Actions: кэш ветки main
      # пишет любое её задание, и код сборки подложил бы в него свои скрипты
      # заданию с токеном Cloudflare, а артефакт распаковывается только в свою
      # папку и ничего из него не исполняется (ревью задачи 43). Неделя
      # хранения: выкладка курсов кладёт свой каждый день, когда курсы новые,
      # и убирает прежние.
      - name: Выкладываемое — выкладке курсов
        if: github.event_name == 'push'
        run: |
          mkdir site
          cp -r dist site/dist
          echo "$GITHUB_SHA" > site/commit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 7

      - name: Выкладка всем
        id: site
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          url="$(bash tools/deploy/deploy.sh main dist "$COMMIT")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Сайт: $url" >> "$GITHUB_STEP_SUMMARY"

      # Та же проверка на выкладке всем: что переключилась она, а не
      # осталась прежняя.
      - name: Проверка сайта
        if: github.event_name == 'push'
        env:
          URL: ${{ steps.site.outputs.url }}
        run: bash tools/deploy/check.sh "$URL" dist

      # И на своём домене: его зона Cloudflare стоит перед Pages и меняет
      # ответы, а настройку зоны в панели правят без сборки и без CI. Адрес
      # выкладки выше её не проходит.
      - name: Проверка своего домена
        if: github.event_name == 'push'
        run: bash tools/deploy/check.sh "$SITE_URL" dist
