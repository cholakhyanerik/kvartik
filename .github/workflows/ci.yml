# Проверка на каждый push и pull request.
#
# Одна ОС, Linux: wasm одинаков на всех системах, а ядро не трогает ничего
# системного. Матрица ОС понадобится только с настольной версией (задача 40).
# Репозиторий приватный, и минуты здесь считаются (Правило 11 в CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый push в ту же ветку отменяет предыдущий прогон: держать очередь
# из устаревших сборок незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Та же версия, что в `trunk-version` у crates/app/Trunk.toml: старше Trunk
  # откажется собирать. Меняется версия — меняются оба места и сумма ниже.
  TRUNK_VERSION: v0.22.0-rc.2
  # Сумма архива `trunk-x86_64-unknown-linux-gnu.tar.gz` этого выпуска
  # (файл `.sha256` рядом с архивом на GitHub, сверено 2026-10-10). Записана
  # здесь, а не скачивается вместе с архивом: подменённый выпуск принёс бы
  # и подменённую сумму.
  TRUNK_SHA256: 42c208270e9f12fe44e88a5acbd2f2ffa3d8534944af06d1a664793a0c7bc3e0
  # Проверка зависимостей по `deny.toml` (Правило 13). 0.20.2 — последняя на
  # GitHub 2026-10-10. Формат `deny.toml` между версиями меняется: сменилась
  # версия — сверить его по исходникам нового выпуска. Сумма архива
  # `cargo-deny-<версия>-x86_64-unknown-linux-musl.tar.gz` взята из файла
  # `.sha256` рядом с ним и совпала со сводкой выпуска на GitHub (2026-10-10);
  # записана здесь по той же причине, что у Trunk.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  # Раннер браузерных тестов — из выпуска wasm-bindgen ровно той версии, что
  # в Cargo.lock (Правило 3): соседняя версия может пройти молча и проверить
  # не тот wasm. Шаг ниже сверяет её с замком. Сумма архива
  # `wasm-bindgen-<версия>-x86_64-unknown-linux-musl.tar.gz` — из файла
  # `.tar.gz.sha256sum` рядом с ним; совпала с полем `digest` в API GitHub
  # (2026-10-12).
  WASM_BINDGEN_VERSION: 0.2.129
  WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e

jobs:
  check:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Готовая сборка с GitHub, а не `cargo install`: та собирается
      # из исходников минут восемь на каждом прогоне.
      - name: Trunk
        run: |
          curl -sSfL -o trunk.tar.gz \
            "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar -xzf trunk.tar.gz -C "$HOME/.cargo/bin" trunk
          rm trunk.tar.gz
          trunk --version

      # Тем же путём, что Trunk: готовая сборка, сумма — из `env` выше.
      - name: cargo-deny
        run: |
          curl -sSfL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz -C "$HOME/.cargo/bin" --strip-components=1 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          rm cargo-deny.tar.gz
          cargo deny --version

      # Тем же путём: готовая сборка, сумма — из `env` выше. Из архива нужен
      # один `wasm-bindgen-test-runner`; версия — только та, что в замке.
      - name: wasm-bindgen-test-runner
        run: |
          grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep -qx "version = \"${WASM_BINDGEN_VERSION}\"" \
            || { echo "wasm-bindgen в Cargo.lock — не ${WASM_BINDGEN_VERSION}: поднять версию и сумму в ci.yml"; exit 1; }
          curl -sSfL -o wasm-bindgen.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf wasm-bindgen.tar.gz -C "$HOME/.cargo/bin" --strip-components=1 \
            "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen-test-runner"
          rm wasm-bindgen.tar.gz
          wasm-bindgen-test-runner --version

      # Ровно те команды, что перечислены в Правиле 2 CLAUDE.md, и в том же
      # порядке. Клиппи дважды: на машине окно собирается как обычная
      # программа, и ветки `#[cfg(target_arch = "wasm32")]` — среди них
      # браузерные тесты — видит только второй прогон.
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p kvartik-app --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace
      # Браузерные тесты — в headless Chrome образа. Драйвер — явно: иначе
      # раннер первым найдёт в PATH geckodriver, и тесты уйдут в Firefox.
      # При нуле тестов раннер выходит с кодом 0 («no tests to run!») —
      # тесты, выключенные `cfg` по ошибке, дали бы зелёный прогон, поэтому
      # число прошедших проверяется. `shell: bash` — ради `pipefail`: без
      # него `tee` проглотил бы код ошибки `cargo`.
      - name: cargo test -p kvartik-app --target wasm32-unknown-unknown --bin kvartik-app
        shell: bash
        run: |
          CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" \
            cargo test -p kvartik-app --target wasm32-unknown-unknown --bin kvartik-app 2>&1 | tee browser-tests.log
          grep -E "test result: ok\. [1-9][0-9]* passed" browser-tests.log
      - run: trunk build --release
        working-directory: crates/app
      # Новая запись в базе RustSec краснит прогон и без нашего изменения —
      # так и задумано: что с ней делать, решает человек (`deny.toml`).
      - run: cargo deny check
